name: Generate Certificate

on:
  issues:
    types: [opened]

concurrency:
  group: cert-request-${{ github.actor }}
  cancel-in-progress: true

jobs:
  build-cert:
    # Workflow will only trigger if the issue title contains "Cert Request"
    if: contains(github.event.issue.title, 'Cert Request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write 
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Data Branch
        uses: actions/checkout@v4
        with:
          ref: data 
          path: db_branch

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: GraphQL Deep Scan & Generate Report
        id: generate
        env:
          USER_INPUT: ${{ github.actor }} 
          USER_ID: ${{ github.actor_id }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request, json, os, sys, re, time

          user = os.environ['USER_INPUT']
          user_id = os.environ['USER_ID']
          issue_body = os.environ['ISSUE_BODY']
          gh_token = os.environ['GH_TOKEN']

          # Org whose repos count toward the certificate. Kept as a constant
          # (matches the original hardcoded 'OWASP' filter) rather than
          # REPO_OWNER, since REPO_OWNER is just wherever this workflow
          # happens to be running from.
          TARGET_ORG = 'OWASP'

          name_match = re.search(r'FullName:\s*(.+)', issue_body)
          real_name = name_match.group(1).strip() if name_match else user

          # --- 1. Anti-Spam & Cooldown System (24 Hours) ---
          cooldown_seconds = 24 * 3600
          cert_path = f"db_branch/certs/{user_id}.json"
          if os.path.exists(cert_path):
              with open(cert_path, "r", encoding="utf-8") as f:
                  try:
                      old_data = json.load(f)
                      last_issued = old_data.get("last_issued", 0)
                      time_passed = time.time() - last_issued

                      if time_passed < cooldown_seconds:
                          hours_left = int((cooldown_seconds - time_passed) / 3600)
                          mins_left = int(((cooldown_seconds - time_passed) % 3600) / 60)
                          error_msg = f"⏳ **System Limit:** You have recently updated your certificate. Please try again in {hours_left} hours and {mins_left} minutes."
                          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
                              env_file.write(f"ERROR_MSG={error_msg}\n")
                          sys.exit(1)
                  except:
                      pass
          # -------------------------------------------------

          headers = {
              'Authorization': f'Bearer {gh_token}',
              'Content-Type': 'application/json',
              'User-Agent': 'OWASP-CRT-GraphQL'
          }

          def run_graphql(query, variables=None):
              payload = json.dumps({'query': query, 'variables': variables or {}}).encode('utf-8')
              req = urllib.request.Request('https://api.github.com/graphql', data=payload, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      result = json.loads(response.read().decode())
              except Exception as e:
                  print(f"::error::GraphQL Error: {e}")
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                      f.write("ERROR_MSG=❌ Connection to the GraphQL server was lost. Please verify that the PAT token is set.\n")
                  sys.exit(1)
              if 'errors' in result:
                  print(f"::warning::GraphQL returned errors: {result['errors']}")
              return result

          # --- 2. Get User's GraphQL Node ID ---
          id_query = """query($login: String!) { user(login: $login) { id } }"""
          id_res = run_graphql(id_query, {"login": user})

          if not id_res or 'errors' in id_res or not id_res.get('data', {}).get('user'):
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write(f"ERROR_MSG=❌ User @{user} was not found in GitHub's GraphQL system.\n")
              sys.exit(1)

          graphql_author_id = id_res['data']['user']['id']

          # --- 3a. Primary-authored commits, FULLY PAGINATED ---
          # FIX 1: the original query used first:100 with no cursor on both
          # the repo list and each repo's commit history, silently
          # truncating both for active contributors / repos.

          REPOS_PAGE_QUERY = """
          query($login: String!, $cursor: String) {
            user(login: $login) {
              repositoriesContributedTo(first: 100, after: $cursor, contributionTypes: [COMMIT]) {
                pageInfo { hasNextPage endCursor }
                edges {
                  node {
                    name
                    owner { login }
                    defaultBranchRef { target { ... on Commit { oid } } }
                  }
                }
              }
            }
          }
          """

          COMMIT_HISTORY_QUERY = """
          query($owner: String!, $name: String!, $authorId: ID!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              defaultBranchRef {
                target {
                  ... on Commit {
                    history(author: { id: $authorId }, first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      edges { node { oid additions deletions committedDate } }
                    }
                  }
                }
              }
            }
          }
          """

          def list_contributed_repo_names(login, org):
              names = []
              cursor = None
              while True:
                  res = run_graphql(REPOS_PAGE_QUERY, {"login": login, "cursor": cursor})
                  block = res.get('data', {}).get('user', {}).get('repositoriesContributedTo', {})
                  for edge in block.get('edges', []):
                      node = edge['node']
                      if node['owner']['login'].upper() == org.upper() and node.get('defaultBranchRef'):
                          names.append(node['name'])
                  page_info = block.get('pageInfo', {})
                  if page_info.get('hasNextPage'):
                      cursor = page_info.get('endCursor')
                  else:
                      break
              return names

          def all_authored_commits(owner, name, author_id):
              commits = []
              cursor = None
              while True:
                  res = run_graphql(COMMIT_HISTORY_QUERY, {
                      "owner": owner, "name": name, "authorId": author_id, "cursor": cursor
                  })
                  branch = res.get('data', {}).get('repository', {}).get('defaultBranchRef')
                  if not branch:
                      break
                  history = branch['target']['history']
                  for edge in history.get('edges', []):
                      commits.append(edge['node'])
                  page_info = history.get('pageInfo', {})
                  if page_info.get('hasNextPage'):
                      cursor = page_info.get('endCursor')
                  else:
                      break
              return commits

          print(f"[*] Fetching contributed {TARGET_ORG} repos for @{user}...")
          repo_names = list_contributed_repo_names(user, TARGET_ORG)

          seen_oids = set()
          repo_stats = {}
          commit_logs = []
          total_commits = 0
          total_added = 0
          total_removed = 0
          first_commit_date = None

          def record_commit(repo_full, oid, additions, deletions, committed_date, note=""):
              global total_commits, total_added, total_removed, first_commit_date
              if oid in seen_oids:
                  return
              seen_oids.add(oid)
              if repo_full not in repo_stats:
                  repo_stats[repo_full] = {'commits': 0, 'added': 0, 'removed': 0}
              repo_stats[repo_full]['commits'] += 1
              repo_stats[repo_full]['added'] += additions
              repo_stats[repo_full]['removed'] += deletions
              total_commits += 1
              total_added += additions
              total_removed += deletions
              if not first_commit_date or committed_date < first_commit_date:
                  first_commit_date = committed_date
              sha = oid[:7]
              commit_url = f"https://github.com/{repo_full}/commit/{oid}"
              suffix = f" {note}" if note else ""
              commit_logs.append(f"- [{sha}]({commit_url}) in **{repo_full}**: +{additions} / -{deletions} lines{suffix}")

          for name in repo_names:
              repo_full = f"{TARGET_ORG}/{name}"
              print(f"[*] Fetching authored commits in {repo_full}...")
              for c in all_authored_commits(TARGET_ORG, name, graphql_author_id):
                  record_commit(repo_full, c['oid'], c['additions'], c['deletions'], c['committedDate'])

          # --- 3b. Co-authored commits from squash-merged PRs ---
          # FIX 2: history(author:{id}) only matches the PRIMARY git author.
          # If someone pushes a commit onto another person's PR branch and
          # that PR gets squash-merged, GitHub folds it into a single commit
          # authored by the PR owner, crediting the contributor only via a
          # "Co-authored-by:" trailer -- exposed in GraphQL as Commit.authors,
          # which the original query never read. We find these by searching
          # merged PRs the user was involved in, then checking each PR's
          # merge commit for a co-author match.

          SEARCH_PR_QUERY = """
          query($q: String!, $cursor: String) {
            search(query: $q, type: ISSUE, first: 50, after: $cursor) {
              pageInfo { hasNextPage endCursor }
              nodes {
                ... on PullRequest {
                  number
                  repository { name owner { login } }
                  mergeCommit {
                    oid
                    additions
                    deletions
                    committedDate
                    author { user { id } }
                    authors(first: 10) { nodes { user { id } } }
                  }
                }
              }
            }
          }
          """

          def find_coauthored_squash_commits(org, login, author_id):
              search_q = f'org:{org} is:pr is:merged involves:{login}'
              found = []
              cursor = None
              while True:
                  res = run_graphql(SEARCH_PR_QUERY, {"q": search_q, "cursor": cursor})
                  block = res.get('data', {}).get('search', {})
                  for node in block.get('nodes', []) or []:
                      if not node or 'mergeCommit' not in node:
                          continue
                      mc = node.get('mergeCommit')
                      if not mc:
                          continue
                      author_block = mc.get('author') or {}
                      primary_user = author_block.get('user') or {}
                      primary_id = primary_user.get('id')
                      co_ids = [
                          (n.get('user') or {}).get('id')
                          for n in mc.get('authors', {}).get('nodes', [])
                      ]
                      if primary_id == author_id:
                          continue  # already counted in 3a as primary author
                      if author_id in co_ids:
                          repo_owner = node['repository']['owner']['login']
                          if repo_owner.upper() != org.upper():
                              continue
                          found.append({
                              'oid': mc['oid'],
                              'additions': mc['additions'],
                              'deletions': mc['deletions'],
                              'committedDate': mc['committedDate'],
                              'repo': f"{repo_owner}/{node['repository']['name']}",
                              'pr_number': node['number'],
                          })
                  page_info = block.get('pageInfo', {})
                  if page_info.get('hasNextPage'):
                      cursor = page_info.get('endCursor')
                  else:
                      break
              return found

          print(f"[*] Searching for squash-merged PRs where @{user} contributed as a co-author...")
          for c in find_coauthored_squash_commits(TARGET_ORG, user, graphql_author_id):
              record_commit(
                  c['repo'], c['oid'], c['additions'], c['deletions'], c['committedDate'],
                  note=f"(co-authored via PR #{c['pr_number']})"
              )

          total_projects = len(repo_stats)

          if total_commits == 0:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write(f"ERROR_MSG=User @{user} has no verified commits in the default branch of public {TARGET_ORG} projects.\n")
              sys.exit(1)

          first_commit_display = first_commit_date.split('T')[0] if first_commit_date else "N/A"

          # --- 4. Generate Final Report ---
          report = "#### 📊 Transparent Telemetry System Factor (Powered by GraphQL)\n"
          report += f"> **Summary:** {total_commits} commits across {total_projects} projects ⟵ (+{total_added} lines added / -{total_removed} lines removed)\n\n"

          report += "**Breakdown of Involved Projects (Repositories):**\n"
          for repo, stats in repo_stats.items():
              report += f"- **[{repo}](https://github.com/{repo})**: {stats['commits']} commits ⟵ (+{stats['added']} / -{stats['removed']})\n"

          report += "\n<details>\n"
          report += "<summary><b>🔍 View Individual Commit Details (Click to Expand)</b></summary>\n\n"
          report += "\n".join(commit_logs)
          report += "\n</details>\n"

          # --- 5. Save to Database ---
          if total_commits >= 50: tier = "Gold"
          elif total_commits >= 10: tier = "Silver"
          else: tier = "Bronze"

          cert_id = user_id

          payload = {
              "id": cert_id,
              "user": user,
              "real_name": real_name,
              "tier": tier,
              "last_issued": int(time.time()),
              "stats": {
                  "first_commit_date": first_commit_display,
                  "merged_commits": str(total_commits),
                  "project_count": str(total_projects),
                  "lines_added": str(total_added),
                  "lines_removed": str(total_removed)
              }
          }

          os.makedirs("db_branch/certs", exist_ok=True)
          file_path = f"db_branch/certs/{cert_id}.json"
          with open(file_path, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          final_url = f"https://{os.environ['REPO_OWNER']}.github.io/{os.environ['REPO_NAME']}/?id={cert_id}"

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"CERT_URL={final_url}\n")
              f.write(f"TIER={tier}\n")
              f.write(f"REAL_NAME={real_name}\n")
              f.write(f"CERT_ID={cert_id}\n")
              f.write(f"FIRST_COMMIT={first_commit_display}\n")
              f.write("LOG_REPORT<<EOF\n")
              f.write(report)
              f.write("\nEOF\n")
        shell: python

      - name: Commit and Push JSON to Data Branch
        if: success() && env.CERT_URL != ''
        run: |
          cd db_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certs/${{ env.CERT_ID }}.json
          git commit -m "db(crt): save cert data for @${{ github.actor }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin data
          git push origin data

      - name: Comment Success & Close Issue
        if: success() && env.CERT_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "### 🎉 Congratulations! Your certificate has been issued/updated.
          **Registered Name:** ${{ env.REAL_NAME }}
          **Unique ID:** \`${{ env.CERT_ID }}\`
          **First Contribution:** ${{ env.FIRST_COMMIT }}
          **Tier:** ${{ env.TIER }}
          
          🔗 [**>> Click Here to View and Download Certificate <<**](${{ env.CERT_URL }})
          
          ---
          ${{ env.LOG_REPORT }}"
          gh issue close $ISSUE --reason "completed"

      - name: Comment Failure & Close Issue
        if: failure() && env.ERROR_MSG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE --body "${{ env.ERROR_MSG }}"
          gh issue close $ISSUE --reason "not planned"
