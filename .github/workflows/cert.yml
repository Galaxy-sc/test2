name: Generate Certificate

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: 'Full Name'
        required: true
        type: string
      github_user:
        description: 'GitHub Username'
        required: true
        type: string
      github_id:
        description: 'GitHub User ID'
        required: true
        type: string

concurrency:
  group: cert-request-${{ inputs.github_user }}
  cancel-in-progress: true

jobs:
  build-cert:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Data Branch
        uses: actions/checkout@v4
        with:
          ref: data 
          path: db_branch

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: GraphQL Deep Scan & Generate Report
        id: generate
        env:
          USER_INPUT: ${{ inputs.github_user }} 
          USER_ID: ${{ inputs.github_id }}
          REAL_NAME_INPUT: ${{ inputs.full_name }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request, urllib.parse, json, os, sys, re, time, math
          
          now = time.time()
          user = os.environ.get('USER_INPUT', '')
          user_id = os.environ.get('USER_ID', '')
          raw_name = os.environ.get('REAL_NAME_INPUT', '').strip()
          gh_token = os.environ.get('GH_TOKEN', '')
          ORG_NAMES = ['OWASP', 'GenAI-Security-Project']
          ORG_SET = {o.upper() for o in ORG_NAMES}
              
          cooldown_seconds = 86400
          
          cert_path = f"db_branch/certs/{user_id}.json"
          attempt_path = f"db_branch/attempts/{user_id}.json"

          def abort_with_error(msg, apply_limit=False):
              print(f"::error::{msg}")
              os.makedirs("db_branch/attempts", exist_ok=True)
              with open(attempt_path, "w", encoding="utf-8") as f:
                  json.dump({
                      "last_attempt": int(now), 
                      "status": "error", 
                      "message": str(msg),
                      "apply_limit": apply_limit
                  }, f)
              sys.exit(1)
              
          try:
              # Enforce cooldown period
              last_time = 0
              if os.path.exists(cert_path):
                  with open(cert_path, "r", encoding="utf-8") as f:
                      try: last_time = max(last_time, json.load(f).get("last_issued", 0))
                      except: pass
                      
              if os.path.exists(attempt_path):
                  with open(attempt_path, "r", encoding="utf-8") as f:
                      try: 
                          att_data = json.load(f)
                          if att_data.get("apply_limit") is True or "No verified commits" in att_data.get("message", ""):
                              last_time = max(last_time, att_data.get("last_attempt", 0))
                      except: pass
                      
              if cooldown_seconds > 0 and last_time > 0 and (now - last_time) < cooldown_seconds:
                  abort_with_error("Rate Limit Exceeded. Cooldown active.", apply_limit=True)

              # Validate user-provided real name
              if len(raw_name) > 20:
                  abort_with_error("Input Error: Name exceeds 20 characters.")
                  
              if re.search(r'[^\w\s.\-]', raw_name):
                  abort_with_error("Input Error: Name contains restricted characters.")
                  
              real_name = raw_name if raw_name else user

              headers = {
                  'Authorization': f'Bearer {gh_token}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OWASP-CRT-GraphQL'
              }

              # Smart Retry Mechanism for GitHub API Timeout / 502 errors
              def run_graphql(query, variables=None, max_retries=4):
                  payload = json.dumps({'query': query, 'variables': variables or {}}).encode('utf-8')
                  for attempt in range(max_retries):
                      req = urllib.request.Request('https://api.github.com/graphql', data=payload, headers=headers)
                      try:
                          with urllib.request.urlopen(req) as response:
                              result = json.loads(response.read().decode())
                              if 'errors' in result:
                                  err_str = str(result['errors'])
                                  if "timeout" in err_str.lower() or "502" in err_str:
                                      if attempt < max_retries - 1:
                                          time.sleep(2 ** (attempt + 1))
                                          continue
                                  abort_with_error(f"GraphQL Error: {err_str}")
                              return result
                      except urllib.error.HTTPError as e:
                          if e.code in [500, 502, 503, 504] and attempt < max_retries - 1:
                              time.sleep(2 ** (attempt + 1))
                              continue
                          abort_with_error(f"GraphQL Connection Error: HTTP {e.code}")
                      except Exception as e:
                          abort_with_error(f"GraphQL Connection Error: {e}")

              print(f"[*] Fetching Graph Identity for user: {user}...")
              user_query = """query($login: String!) { user(login: $login) { id name createdAt } }"""
              user_res = run_graphql(user_query, {"login": user})
              
              if not user_res or 'errors' in user_res or not user_res.get('data', {}).get('user'):
                  abort_with_error(f"User Not Found: {user}")
                  
              graphql_author_id = user_res['data']['user']['id']
              github_real_name = user_res['data']['user'].get('name') or ''
              created_at = user_res['data']['user']['createdAt']
              
              unique_commits = {}
              target_repos_dict = {}
              commits_to_fetch = set()

              # ==========================================
              # Phase 1: Deep REST Search (The Co-author & Squash Catcher)
              # ==========================================
              print("[*] Phase 1: Deep REST API Search (Catching Squashed, Co-authored, and Non-default branch commits)...")
              search_headers = headers.copy()
              search_headers['Accept'] = 'application/vnd.github+json'
              
              queries_to_run = set()
              for org in ORG_NAMES:
                  for qualifier in ['org', 'user']:
                      queries_to_run.add(f"author:{user} {qualifier}:{org}")
                      queries_to_run.add(f'"{user}" {qualifier}:{org}')
                      if github_real_name:
                          queries_to_run.add(f'"{github_real_name}" {qualifier}:{org}')

              for q_str in queries_to_run:
                  page = 1
                  while page <= 4: # Max 4 pages to avoid rate limits
                      encoded_query = urllib.parse.quote(q_str)
                      search_url = f"https://api.github.com/search/commits?q={encoded_query}&per_page=100&page={page}"
                      req = urllib.request.Request(search_url, headers=search_headers)
                      try:
                          with urllib.request.urlopen(req) as response:
                              result = json.loads(response.read().decode())
                              items = result.get('items', [])
                              for item in items:
                                  sha = item['sha']
                                  repo_full = item['repository']['full_name']
                                  owner, repo_name = repo_full.split('/')
                                  if owner.upper() in ORG_SET:
                                      commits_to_fetch.add((owner, repo_name, sha))
                                      if repo_full not in target_repos_dict:
                                          target_repos_dict[repo_full] = {"owner": owner, "name": repo_name}
                                          print(f"    - [Deep-Search-Hit] Found repository: {repo_full}")
                              if len(items) < 100:
                                  break
                              page += 1
                              time.sleep(2)
                      except urllib.error.HTTPError as e:
                          if e.code == 403:
                              time.sleep(5) # Wait out secondary rate limit
                          break
                      except Exception:
                          break

              # ==========================================
              # Phase 2: Graph & Events (Catching Direct Commits)
              # ==========================================
              print("[*] Phase 2: Scanning Contribution Graph & Events API...")
              start_year = int(created_at[:4])
              current_year = int(time.strftime("%Y"))

              for year in range(start_year, current_year + 1):
                  from_date = f"{year}-01-01T00:00:00Z"
                  to_date = f"{year}-12-31T23:59:59Z"
                  graph_query = """
                  query($login: String!, $from: DateTime!, $to: DateTime!) {
                    user(login: $login) { contributionsCollection(from: $from, to: $to) {
                        commitContributionsByRepository(maxRepositories: 100) { repository { nameWithOwner owner { login } name } }
                    }}
                  }
                  """
                  try:
                      graph_res = run_graphql(graph_query, {"login": user, "from": from_date, "to": to_date})
                      collection = graph_res.get('data', {}).get('user', {}).get('contributionsCollection', {})
                      for repo_contrib in collection.get('commitContributionsByRepository', []):
                          repo_node = repo_contrib.get('repository')
                          if not repo_node: continue
                          owner = repo_node['owner']['login']
                          if owner.upper() in ORG_SET:
                              repo_full = repo_node['nameWithOwner']
                              if repo_full not in target_repos_dict:
                                  target_repos_dict[repo_full] = {"owner": owner, "name": repo_node['name']}
                  except: pass

              events_url = f"https://api.github.com/users/{user}/events?per_page=100"
              try:
                  req = urllib.request.Request(events_url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      for event in json.loads(response.read().decode()):
                          if event.get('type') in ['PushEvent', 'PullRequestEvent', 'IssuesEvent']:
                              repo_full = event['repo']['name']
                              owner, name = repo_full.split('/')
                              if owner.upper() in ORG_SET and repo_full not in target_repos_dict:
                                  target_repos_dict[repo_full] = {"owner": owner, "name": name}
              except: pass

              print(f"[*] Found {len(target_repos_dict)} total target repositories.")

              # ==========================================
              # Phase 3: Fetch Primary History
              # ==========================================
              print("[*] Phase 3: Fetching standard history from default branches...")
              commit_query = """
              query($owner: String!, $name: String!, $authorId: ID!, $cursor: String) {
                repository(owner: $owner, name: $name) {
                  defaultBranchRef {
                    target { ... on Commit { history(author: { id: $authorId }, first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      edges { node { oid additions deletions committedDate } }
                    }}}
                  }
                }
              }
              """
              for repo_full, repo in target_repos_dict.items():
                  cursor = None
                  while True:
                      c_res = run_graphql(commit_query, {"owner": repo['owner'], "name": repo['name'], "authorId": graphql_author_id, "cursor": cursor})
                      repo_node = c_res.get('data', {}).get('repository') or {}
                      branch_ref = repo_node.get('defaultBranchRef') or {}
                      history = branch_ref.get('target', {}).get('history', {})
                      
                      for commit_edge in history.get('edges', []):
                          c = commit_edge['node']
                          sha = c['oid']
                          unique_commits[sha] = {
                              'repo': repo_full,
                              'added': c['additions'],
                              'removed': c['deletions'],
                              'date': c['committedDate'],
                              'type': 'Direct/Primary'
                          }

                      if history.get('pageInfo', {}).get('hasNextPage'):
                          cursor = history['pageInfo']['endCursor']
                      else:
                          break

              # ==========================================
              # Phase 4: Resolving the Deep Search Commits
              # ==========================================
              print("[*] Phase 4: Resolving line additions/deletions for Squashed and Co-authored commits...")
              commits_by_repo = {}
              for owner, repo_name, sha in commits_to_fetch:
                  if sha in unique_commits: continue
                  repo_full = f"{owner}/{repo_name}"
                  if repo_full not in commits_by_repo:
                      commits_by_repo[repo_full] = []
                  commits_by_repo[repo_full].append(sha)
                  
              for repo_full, shas in commits_by_repo.items():
                  owner, repo_name = repo_full.split('/')
                  chunk_size = 40
                  for i in range(0, len(shas), chunk_size):
                      chunk = shas[i:i+chunk_size]
                      query_parts = []
                      for idx, sha in enumerate(chunk):
                          query_parts.append(f'commit_{idx}: object(oid: "{sha}") {{ ... on Commit {{ oid additions deletions committedDate message authors(first: 5) {{ edges {{ node {{ name user {{ login }} }} }} }} }} }}')
                      
                      gql_query = f'query {{ repository(owner: "{owner}", name: "{repo_name}") {{ {" ".join(query_parts)} }} }}'
                      res = run_graphql(gql_query)
                      repo_data = res.get('data', {}).get('repository') or {}
                      
                      for idx, sha in enumerate(chunk):
                          c = repo_data.get(f"commit_{idx}")
                          if not c: continue
                          
                          is_verified = False
                          for a_edge in c.get('authors', {}).get('edges', []):
                              node = a_edge.get('node', {})
                              a_user = node.get('user')
                              if a_user and a_user.get('login', '').lower() == user.lower():
                                  is_verified = True
                                  break
                              if node.get('name', '').lower() == user.lower() or (github_real_name and node.get('name', '').lower() == github_real_name.lower()):
                                  is_verified = True
                                  break
                                  
                          if not is_verified:
                              msg = c.get('message', '').lower()
                              u_lower = user.lower()
                              r_lower = github_real_name.lower() if github_real_name else None
                              if (u_lower in msg) or (r_lower and r_lower in msg):
                                  if "co-authored-by:" in msg or "signed-off-by:" in msg:
                                      is_verified = True
                                      
                          if is_verified:
                              unique_commits[sha] = {
                                  'repo': repo_full,
                                  'added': c.get('additions', 0),
                                  'removed': c.get('deletions', 0),
                                  'date': c.get('committedDate', ''),
                                  'type': 'Deep-Search-Resolved'
                              }

              total_commits = len(unique_commits)
              
              if total_commits == 0:
                  abort_with_error("No verified commits found in the OWASP or GenAI Security Project repositories.", apply_limit=True)

              total_added = sum(c['added'] for c in unique_commits.values())
              total_removed = sum(c['removed'] for c in unique_commits.values())
              
              raw_total = total_added + total_removed

              first_commit_date = min(c['date'] for c in unique_commits.values())
              first_commit_display = first_commit_date.split('T')[0] if first_commit_date else "N/A"

              # Normalization constants and scoring thresholds
              P99_ADD = 290764.32000000024
              P99_DEL = 130211.56000000004
              P99_CMT = 536.5200000000004
              OUTLIER_UPPER = 17.980652793952775

              SILVER_THRESHOLD = 0.000818
              GOLD_THRESHOLD = 0.006063

              log_raw = math.log1p(raw_total)
              
              if log_raw > OUTLIER_UPPER:
                  tier = "Gold"
                  final_score = "Exceptional"
              else:
                  add_norm = min(total_added / P99_ADD, 1.0) if P99_ADD > 0 else 0
                  del_norm = min(total_removed / P99_DEL, 1.0) if P99_DEL > 0 else 0
                  cmt_norm = min(total_commits / P99_CMT, 1.0) if P99_CMT > 0 else 0
                  
                  score = (add_norm * 0.50) + (del_norm * 0.40) + (cmt_norm * 0.10)
                  final_score = f"{score:.6f}"
                  
                  if score >= GOLD_THRESHOLD: tier = "Gold"
                  elif score >= SILVER_THRESHOLD: tier = "Silver"
                  else: tier = "Bronze"

              # Aggregate per-repository statistics
              repo_stats = {}
              for sha, data in unique_commits.items():
                  r_name = data['repo']
                  if r_name not in repo_stats:
                      repo_stats[r_name] = {'commits': 0, 'added': 0, 'removed': 0}
                      
                  repo_stats[r_name]['commits'] += 1
                  repo_stats[r_name]['added'] += data['added']
                  repo_stats[r_name]['removed'] += data['removed']

              total_projects = len(repo_stats)

              if os.path.exists(attempt_path):
                  try: os.remove(attempt_path)
                  except: pass

              cert_id = user_id
              
              payload = {
                  "id": cert_id,
                  "user": user, 
                  "real_name": real_name, 
                  "tier": tier,
                  "score": final_score,
                  "last_issued": int(now),
                  "stats": {
                      "first_commit_date": first_commit_display,
                      "merged_commits": str(total_commits),
                      "project_count": str(total_projects),
                      "lines_added": str(total_added), 
                      "lines_removed": str(total_removed)
                  }
              }
              
              os.makedirs("db_branch/certs", exist_ok=True)
              file_path = f"db_branch/certs/{cert_id}.json"
              with open(file_path, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
                  
              print(f"[*] Process complete. Certificate updated for {user}.")
          except Exception as e:
              abort_with_error(f"Internal Processing Error: {str(e)}")
        shell: python

      - name: Commit and Push Records to Data Branch
        if: always()
        run: |
          if [ -d "db_branch" ]; then
            cd db_branch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            mkdir -p attempts certs
            git add -A attempts/ certs/ 2>/dev/null || true

            if git diff --staged --quiet; then
              echo "[*] No changes to commit."
              exit 0
            fi

            git commit -m "db(sys): update records for @${{ inputs.github_user }} [skip ci]"

            max_attempts=5
            attempt=1
            pushed=false

            while [ $attempt -le $max_attempts ]; do
              echo "[*] Push attempt $attempt/$max_attempts..."

              if git push origin data; then
                pushed=true
                break
              fi

              echo "[*] Push rejected, fetching + rebasing onto latest data branch..."
              git fetch origin data

              if ! git rebase origin/data; then
                echo "::error::Rebase conflict while saving certificate record."
                git rebase --abort
                break
              fi

              sleep $((RANDOM % 5 + 1))
              attempt=$((attempt + 1))
            done

            if [ "$pushed" = false ]; then
              echo "::error::Failed to push certificate record to data branch after $max_attempts attempts."
              exit 1
            fi
          fi
